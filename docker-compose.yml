services:

  postgres:
    image: postgres:18
    container_name: cybermind-postgres

    environment:
      POSTGRES_DB: CyberMind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Thile@123456

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CyberMind"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: cybermind-backend

    ports:
      - "3000:3000"

    env_file:
      - ./server/.env.docker

    volumes:
    - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: cybermind-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data:
  uploads_data: