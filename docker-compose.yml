services:

  secrets:
    image: alpine:3.20
    container_name: cybermind-secrets
    command:
      - sh
      - -c
      - |
        set -e
        gen() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        [ -s /secrets/db_password ] || gen > /secrets/db_password
        [ -s /secrets/jwt_secret ] || gen > /secrets/jwt_secret
        chmod 644 /secrets/db_password /secrets/jwt_secret
    volumes:
      - secrets_data:/secrets


  postgres:
    image: postgres:18
    container_name: cybermind-postgres

    environment:
      POSTGRES_DB: CyberMind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /secrets/db_password


    volumes:
      - postgres_data:/var/lib/postgresql
      - secrets_data:/secrets:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CyberMind"]
      interval: 5s
      timeout: 5s
      retries: 10

    depends_on:
      secrets:
        condition: service_completed_successfully


  ollama:
    image: ollama/ollama:latest
    container_name: cybermind-ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"        
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    container_name: cybermind-ollama-pull
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: cybermind-backend

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: CyberMind
      DB_USER: postgres
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b


    command:
      - sh
      - -c
      - |
        export DB_PASSWORD="$$(cat /secrets/db_password)"
        export JWT_SECRET="$$(cat /secrets/jwt_secret)"
        exec node server/src/server.js

    volumes:
      - uploads_data:/app/uploads
      - secrets_data:/secrets:ro

    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: cybermind-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data:
  uploads_data:
  ollama_data:
  secrets_data:
